<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F7FF">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("muse_theme")||"light";}catch(e){document.documentElement.dataset.theme="light";}</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Muse</title>
<style>
:root{--bg:#F8F7FF;--panel:#FFFFFF;--panel2:#ECE9FB;--txt:#1C1A2E;--mut:#6C6A80;--acc:#5B3FD6;--acc2:#A855F7;--bd:#E0DCF5;--bd2:#D6D2EE;--code:#F1EFFB;--shadow:0 8px 24px rgba(91,63,214,.12);--shadow2:0 6px 18px rgba(91,63,214,.18);--user:linear-gradient(135deg,#5B3FD6,#7A5AF0);--top:linear-gradient(180deg,#ECE9FB 0%,#F8F7FF 100%);--ghost:rgba(91,63,214,.08)}
[data-theme=dark]{--bg:#14121f;--panel:#1c1930;--panel2:#262244;--txt:#ecebf5;--mut:#9a97b8;--acc:#9b7bff;--acc2:#c084fc;--bd:#322d57;--bd2:#3b3567;--code:#0d0b17;--shadow:0 8px 24px #0006;--shadow2:0 6px 18px #0007;--user:linear-gradient(135deg,#6d4fe0,#b04fd1);--top:linear-gradient(180deg,#1b1733 0%,#14121f 100%);--ghost:rgba(155,123,255,.12)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex}
#side{width:280px;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .2s;z-index:5}
#side header{padding:16px;font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
#side header span{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;border-radius:16px;padding:10px 16px;color:#fff;font-weight:600;box-shadow:var(--shadow2)}
.ghost{background:var(--panel2);border:1px solid var(--bd);border-radius:16px;padding:8px 12px;color:var(--txt)}
#new{margin:0 12px 8px;border-radius:20px}
#list{flex:1;overflow:auto;padding:4px 8px}
.item{padding:10px 12px;border-radius:14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--mut)}
.item:hover,.item.on{background:var(--panel2);color:var(--txt)}
.item b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item i{font-style:normal;opacity:.5}
#side footer{padding:12px;border-top:1px solid var(--bd);display:flex;gap:8px}
#side footer button{flex:1;padding:8px 6px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--bd);background:var(--top)}
.tl{display:flex;align-items:center;gap:8px;padding-top:6px;min-width:0}
.tl select{flex:1;min-width:0;text-overflow:ellipsis}
#menu{display:none;border-radius:50%;width:40px;height:40px;padding:0}
select,input{background:var(--panel);color:var(--txt);border:1px solid var(--bd2);border-radius:999px;padding:8px 12px;font:inherit}
dialog input{border-radius:14px}
#who{display:flex;flex-direction:column;align-items:center;position:relative;user-select:none}
#avatarWrap{position:relative;width:88px;height:88px}
#avatarWrap .glow{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(91,63,214,.42) 0%,rgba(168,85,247,.2) 45%,transparent 70%);filter:blur(6px);opacity:.55;transition:opacity .4s}
#avatar{position:relative;width:88px;height:88px;display:block;cursor:pointer;touch-action:manipulation}
#whoName{margin-top:-6px;position:relative;display:flex;flex-direction:column;align-items:center;background:var(--panel);border:1px solid var(--bd);border-radius:999px;padding:3px 14px 4px;box-shadow:var(--shadow);min-width:104px}
#whoName b{font-size:15px;line-height:1.2}
#whoName small{font-size:11px;color:var(--mut);line-height:1.2}
#who[data-state=thinking] .glow{opacity:1;animation:pulse 1.3s ease-in-out infinite}
#who[data-state=thinking] #status::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
#who[data-state=happy] .glow{opacity:.95}
#who[data-state=sad] .glow{opacity:.2}
@keyframes pulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.12)}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}
/* Repli sans WebGL : mascotte en CSS */
#who.fallback #avatar{display:none}
#who.fallback #avatarWrap::after{content:'';position:absolute;left:14px;top:18px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd6f0,#9b7bff 60%,#6d4fe0);box-shadow:0 8px 20px #0007;animation:bob 3s ease-in-out infinite}
#who.fallback[data-state=thinking] #avatarWrap::after{animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#msgs{flex:1;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.m{max-width:min(760px,92%);padding:12px 16px;border-radius:22px;white-space:pre-wrap;word-wrap:break-word}
.m.user{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:8px;box-shadow:var(--shadow2)}
.m.user a{color:#fff}
.m.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--bd);border-bottom-left-radius:8px;box-shadow:var(--shadow)}
.m.err{border-color:#e5484d;color:#c2262b}
[data-theme=dark] .m.err{color:#ffb3b3}
.m.wait{color:var(--mut)}
.m pre{background:var(--code);border:1px solid var(--bd);border-radius:14px;padding:10px;overflow:auto;white-space:pre}
.m code{font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.m :not(pre)>code{background:var(--code);padding:2px 6px;border-radius:8px}
.m a{color:var(--acc)}
#empty{margin:auto;text-align:center;color:var(--mut);padding:0 12px}
#empty h1{font-size:34px;margin:0 0 6px;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:480px;margin:18px auto 0}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--bd2);border-radius:18px;padding:12px 8px;color:var(--txt);font-size:13.5px;line-height:1.3;box-shadow:var(--shadow)}
.chip span{font-size:20px}
.chip:hover{border-color:var(--acc)}
form{display:flex;align-items:flex-end;gap:6px;margin:8px 12px calc(10px + env(safe-area-inset-bottom));padding:5px 6px;background:var(--panel);border:1px solid var(--bd2);border-radius:28px;box-shadow:var(--shadow)}
textarea{flex:1;resize:none;max-height:180px;background:transparent;color:var(--txt);border:0;border-radius:14px;padding:10px 6px;font:inherit;outline:none}
textarea:focus,input:focus{outline:none}
input:focus{border-color:var(--acc)}
form:focus-within{border-color:var(--acc)}
dialog textarea{background:var(--panel2);border:1px solid var(--bd);padding:12px 14px}
dialog textarea:focus{border-color:var(--acc)}
.ico{width:40px;height:40px;padding:0;font-size:19px;flex:none;border-radius:50%;background:var(--panel2);border:0;color:var(--acc)}
#send{width:40px;height:40px;padding:0;font-size:16px;flex:none;border-radius:50%}
#pending{display:flex;gap:8px;padding:8px 14px 0;overflow-x:auto}
#pending[hidden]{display:none}
.pchip{position:relative;flex:none}
.pchip img{height:60px;width:60px;object-fit:cover;border-radius:14px;border:1px solid var(--bd);display:block}
.pchip .pfile{display:flex;flex-direction:column;justify-content:center;height:60px;max-width:160px;padding:0 12px;background:var(--panel2);border:1px solid var(--bd);border-radius:14px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pchip .pfile small{color:var(--mut)}
.pchip button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--bd);background:var(--panel);color:var(--txt);font-size:11px;line-height:1;padding:0}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:flex-start}
.m.user:has(.atts){white-space:normal}
.atts img{max-width:200px;max-height:200px;min-width:60px;min-height:60px;border-radius:14px;cursor:pointer;background:var(--ghost);object-fit:cover}
.m.bot .atts img{max-width:min(420px,100%);max-height:320px}
.confirm{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.confirm button{border-radius:14px;padding:8px 14px;font-weight:600}
.confirm .yes{background:linear-gradient(135deg,#2fbf71,#1f9d8a);border:0;color:#fff}
.fchip{background:var(--ghost);border-radius:12px;padding:6px 10px;font-size:14px;cursor:pointer}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--txt);border:1px solid var(--acc);padding:8px 14px;border-radius:16px;font-size:14px;z-index:20;box-shadow:var(--shadow2)}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--bd);border-radius:24px;width:min(560px,92vw);box-shadow:var(--shadow)}
dialog textarea{width:100%;height:260px}
dialog input{width:100%;margin:4px 0 12px}
dialog label{font-size:14px;color:var(--mut)}
dialog::backdrop{background:#0008}
.hint{color:var(--mut);font-size:14px;margin-top:0}
#plusWrap{position:relative;flex:none}
#plusMenu{position:absolute;bottom:52px;left:0;background:var(--panel);border:1px solid var(--bd);border-radius:20px;padding:6px;min-width:250px;box-shadow:var(--shadow2);z-index:15}
#plusMenu[hidden]{display:none}
#plusMenu button{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:10px 12px}
#plusMenu button:hover{background:var(--panel2)}
#plusMenu small{color:var(--mut);font-size:12px}
#plusMenu p{margin:4px 12px 6px;font-size:12px;color:var(--mut)}
#plusBtn{font-size:26px;line-height:1}
#micBtn{font-size:19px;line-height:1}
.tr{display:flex;justify-content:flex-end;padding-top:6px}
#ttsBtn{font-size:18px}
#ttsBtn.on{background:var(--acc);color:#fff}
.m .tools{display:flex;justify-content:flex-end;margin-top:8px}
.tts{border:0;background:var(--panel2);color:var(--acc);border-radius:999px;padding:4px 12px;font-size:13px}
.tts.on{background:var(--acc);color:#fff}
input[type=range]{padding:0;border:0;background:none;width:100%;margin:6px 0 10px;accent-color:var(--acc)}
#micBtn.on{background:#e5484d;color:#fff;animation:micpulse 1.1s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}50%{box-shadow:0 0 0 9px rgba(229,72,77,0)}}
/* Panneau d'écoute (comme le panneau de la bulle) */
#listen{display:none;margin:8px 12px 0;padding:10px 12px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:28px;box-shadow:var(--shadow)}
#listen.on{display:block}
#wave{display:flex;align-items:center;justify-content:center;gap:3px;height:64px;background:var(--panel2);border-radius:20px;padding:0 12px;overflow:hidden}
#wave i{display:block;width:5px;border-radius:3px;height:12%;background:linear-gradient(180deg,#4f46e5,#a855f7);animation:wv var(--d,1s) ease-in-out infinite;animation-delay:var(--l,0s)}
@keyframes wv{0%,100%{height:12%}50%{height:var(--h,80%)}}
#listen b{display:block;text-align:center;color:var(--acc);font-size:18px;margin-top:8px}
#listen small{display:block;text-align:center;color:var(--mut);min-height:1.4em}
@media(max-width:480px){.lbl{display:none}}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}#side.open{transform:none}#menu{display:block}}
</style>
</head>
<body>
<aside id="side">
  <header>✨ <span>Muse</span></header>
  <button class="btn" id="new">+ Nouvelle discussion</button>
  <div id="list"></div>
  <footer><button class="ghost" id="memBtn">🧠 Mémoire</button><button class="ghost" id="cfgBtn">⚙️ Réglages</button><button class="ghost" id="themeBtn" title="Thème clair / sombre" aria-label="Thème clair ou sombre">🌙</button></footer>
</aside>
<main>
  <div id="top">
    <div class="tl">
      <button class="ghost" id="menu">☰</button>
      <select id="mode" title="Auto : Muse choisit seule ses outils. Tu peux forcer un mode dans la liste.">
        <option value="auto">✨ Auto</option>
        <option disabled>── Forcer un mode ──</option>
        <option value="polyvalent">🎯 Polyvalent</option>
        <option value="compagnon">💬 Compagnon</option>
        <option value="creatif">🎨 Création</option>
        <option value="dev">💻 Dev / Odoo</option>
        <option value="perso">📬 Assistant</option>
        <option value="ordi">🖥️ Ordinateur</option>
        <option value="phone">📱 Téléphone</option>
      </select>
    </div>
    <div id="who" data-state="idle">
      <div id="avatarWrap"><span class="glow"></span><canvas id="avatar" width="88" height="88" title="Dis bonjour à Muse"></canvas></div>
      <div id="whoName"><b>Muse</b><small id="status">✨ en ligne</small></div>
    </div>
    <div class="tr"><button type="button" class="ghost ico" id="ttsBtn" title="Lecture à voix haute des réponses de Muse (désactivée)" aria-label="Lecture à voix haute">🔇</button></div>
  </div>
  <div id="msgs"></div>
  <div id="pending" hidden></div>
  <div id="listen"><div id="wave"></div><b id="listenSt">J’écoute…</b><small id="listenHint">Parle, je t’écoute</small></div>
  <form id="f">
    <div id="plusWrap">
      <button type="button" class="ghost ico" id="plusBtn" title="Joindre des fichiers, photos ou un dossier">＋</button>
      <div id="plusMenu" hidden>
        <button type="button" id="optFile">📎 Fichiers <small>PDF, Word, Excel, code…</small></button>
        <button type="button" id="optPhoto">🖼️ Photos</button>
        <button type="button" id="optCam">📷 Appareil photo</button>
        <button type="button" id="optDir">📁 Dossier <small>envoyé en .zip</small></button>
        <p>Sur téléphone : compresse ton dossier en .zip puis choisis « Fichiers ».</p>
      </div>
    </div>
    <textarea id="in" rows="1" placeholder="Écris à Muse…"></textarea>
    <button type="button" class="ghost ico" id="micBtn" title="Parler à Muse" aria-label="Parler à Muse">🎤</button>
    <button class="btn" id="send" aria-label="Envoyer" title="Envoyer">➤</button>
    <input type="file" id="fileIn" multiple hidden>
    <input type="file" id="photoIn" multiple hidden accept="image/*">
    <input type="file" id="dirIn" hidden webkitdirectory multiple>
    <input type="file" id="camIn" hidden accept="image/*" capture="environment">
  </form>
</main>

<dialog id="cfg">
  <h3>⚙️ Connexion au cerveau de Muse</h3>
  <p class="hint">Ces infos restent dans ce navigateur uniquement.</p>
  <label>Dépôt privé (propriétaire/nom)</label>
  <input id="cfgRepo" placeholder="ainacedric/muse-brain" autocapitalize="off" autocomplete="off">
  <label>Token GitHub (fine-grained : Issues + Contents en lecture/écriture sur ce dépôt)</label>
  <input id="cfgTok" type="password" placeholder="github_pat_…" autocomplete="off">
  <div id="cfgMsg" class="hint"></div>
  <hr style="border:0;border-top:1px solid var(--bd);margin:14px 0">
  <label>🔊 Voix de Muse (lecture à voix haute)</label>
  <select id="ttsVoice" style="width:100%;margin:4px 0 12px"></select>
  <label>Vitesse : <b id="ttsRateV">1×</b></label>
  <input id="ttsRate" type="range" min="0.7" max="1.5" step="0.05" value="1">
  <div style="margin-bottom:14px"><button class="ghost" id="ttsTest" type="button">▶️ Tester la voix</button></div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="ghost" id="cfgCancel" type="button">Fermer</button><button class="btn" id="cfgSave" type="button">Tester et enregistrer</button>
  </div>
</dialog>

<dialog id="dlg">
  <h3>🧠 Ce que Muse sait de toi</h3>
  <p class="hint">Un fait par ligne. Modifie ou supprime librement.</p>
  <textarea id="memTxt"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
    <button class="ghost" id="memCancel" type="button">Fermer</button><button class="btn" id="memSave" type="button">Enregistrer</button>
  </div>
</dialog>
<script src="./vendor/jszip.min.js"></script>
<script src="./vendor/three.min.js"></script>
<script src="./avatar.js"></script>
<script src="./app.js"></script>
</body>
</html>
