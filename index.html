<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Muse</title>
<style>
:root{--bg:#14121f;--panel:#1c1930;--panel2:#262244;--txt:#ecebf5;--mut:#9a97b8;--acc:#9b7bff;--acc2:#ff7ac6;--bd:#322d57}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex}
#side{width:280px;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .2s;z-index:5}
#side header{padding:16px;font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
#side header span{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;border-radius:12px;padding:10px 14px;color:#fff;font-weight:600}
.ghost{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
#new{margin:0 12px 8px}
#list{flex:1;overflow:auto;padding:4px 8px}
.item{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--mut)}
.item:hover,.item.on{background:var(--panel2);color:var(--txt)}
.item b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item i{font-style:normal;opacity:.5}
#side footer{padding:12px;border-top:1px solid var(--bd);display:flex;gap:8px}
#side footer button{flex:1}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#1b1733 0%,var(--bg) 100%)}
.tl{display:flex;align-items:center;gap:8px;padding-top:6px;min-width:0}
.tl select{flex:1;min-width:0;text-overflow:ellipsis}
#menu{display:none}
select,input{background:var(--panel2);color:var(--txt);border:1px solid var(--bd);border-radius:10px;padding:8px;font:inherit}
#who{display:flex;flex-direction:column;align-items:center;position:relative;user-select:none}
#avatarWrap{position:relative;width:88px;height:88px}
#avatarWrap .glow{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(155,123,255,.45) 0%,rgba(255,122,198,.18) 45%,transparent 70%);filter:blur(6px);opacity:.55;transition:opacity .4s}
#avatar{position:relative;width:88px;height:88px;display:block;cursor:pointer;touch-action:manipulation}
#whoName{margin-top:-6px;position:relative;display:flex;flex-direction:column;align-items:center;background:var(--panel);border:1px solid var(--bd);border-radius:999px;padding:3px 14px 4px;box-shadow:0 6px 18px #0006;min-width:104px}
#whoName b{font-size:15px;line-height:1.2}
#whoName small{font-size:11px;color:var(--mut);line-height:1.2}
#who[data-state=thinking] .glow{opacity:1;animation:pulse 1.3s ease-in-out infinite}
#who[data-state=thinking] #status::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
#who[data-state=happy] .glow{opacity:.95}
#who[data-state=sad] .glow{opacity:.2}
@keyframes pulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.12)}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}
/* Repli sans WebGL : mascotte en CSS */
#who.fallback #avatar{display:none}
#who.fallback #avatarWrap::after{content:'';position:absolute;left:14px;top:18px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd6f0,#9b7bff 60%,#6d4fe0);box-shadow:0 8px 20px #0007;animation:bob 3s ease-in-out infinite}
#who.fallback[data-state=thinking] #avatarWrap::after{animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#msgs{flex:1;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.m{max-width:min(760px,92%);padding:12px 16px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.m.user{align-self:flex-end;background:linear-gradient(135deg,#6d4fe0,#b04fd1);border-bottom-right-radius:6px}
.m.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--bd);border-bottom-left-radius:6px}
.m.err{border-color:#ff6b6b;color:#ffb3b3}
.m.wait{color:var(--mut)}
.m pre{background:#0d0b17;border:1px solid var(--bd);border-radius:10px;padding:10px;overflow:auto;white-space:pre}
.m code{font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.m :not(pre)>code{background:#0d0b17;padding:2px 6px;border-radius:6px}
.m a{color:var(--acc2)}
#empty{margin:auto;text-align:center;color:var(--mut);padding:0 12px}
#empty h1{font-size:34px;margin:0 0 6px;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
form{display:flex;align-items:flex-end;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
textarea{flex:1;resize:none;max-height:180px;background:var(--panel);color:var(--txt);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font:inherit;outline:none}
textarea:focus,input:focus{border-color:var(--acc);outline:none}
.ico{width:44px;height:44px;padding:0;font-size:20px;flex:none;border-radius:12px}
#pending{display:flex;gap:8px;padding:8px 14px 0;overflow-x:auto}
#pending[hidden]{display:none}
.pchip{position:relative;flex:none}
.pchip img{height:60px;width:60px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);display:block}
.pchip .pfile{display:flex;flex-direction:column;justify-content:center;height:60px;max-width:160px;padding:0 12px;background:var(--panel2);border:1px solid var(--bd);border-radius:10px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pchip .pfile small{color:var(--mut)}
.pchip button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--txt);font-size:11px;line-height:1;padding:0}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:flex-start}
.m.user:has(.atts){white-space:normal}
.atts img{max-width:200px;max-height:200px;min-width:60px;min-height:60px;border-radius:12px;cursor:pointer;background:#0003;object-fit:cover}
.m.bot .atts img{max-width:min(420px,100%);max-height:320px}
.confirm{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.confirm button{border-radius:10px;padding:8px 14px;font-weight:600}
.confirm .yes{background:linear-gradient(135deg,#2fbf71,#1f9d8a);border:0;color:#fff}
.fchip{background:#0003;border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);padding:8px 14px;border-radius:12px;font-size:14px;z-index:20}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--bd);border-radius:16px;width:min(560px,92vw)}
dialog textarea{width:100%;height:260px}
dialog input{width:100%;margin:4px 0 12px}
dialog label{font-size:14px;color:var(--mut)}
dialog::backdrop{background:#000a}
.hint{color:var(--mut);font-size:14px;margin-top:0}
#plusWrap{position:relative;flex:none}
#plusMenu{position:absolute;bottom:52px;left:0;background:var(--panel2);border:1px solid var(--bd);border-radius:14px;padding:6px;min-width:250px;box-shadow:0 10px 30px #000a;z-index:15}
#plusMenu[hidden]{display:none}
#plusMenu button{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px}
#plusMenu button:hover{background:var(--panel)}
#plusMenu small{color:var(--mut);font-size:12px}
#plusMenu p{margin:4px 12px 6px;font-size:12px;color:var(--mut)}
#plusBtn{font-size:26px;line-height:1}
@media(max-width:480px){.lbl{display:none}.ico{width:40px}}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}#side.open{transform:none}#menu{display:block}}
</style>
</head>
<body>
<aside id="side">
  <header>✨ <span>Muse</span></header>
  <button class="btn" id="new">+ Nouvelle discussion</button>
  <div id="list"></div>
  <footer><button class="ghost" id="memBtn">🧠 Mémoire</button><button class="ghost" id="cfgBtn">⚙️ Réglages</button></footer>
</aside>
<main>
  <div id="top">
    <div class="tl">
      <button class="ghost" id="menu">☰</button>
      <select id="mode">
        <option value="polyvalent">🎯 Polyvalent</option>
        <option value="compagnon">💬 Compagnon</option>
        <option value="creatif">🎨 Création (GYOO)</option>
        <option value="dev">💻 Dev / Odoo</option>
        <option value="perso">📬 Assistant (Gmail · Agenda · Drive)</option>
        <option value="ordi">🖥️ Ordinateur (navigateur + code)</option>
        <option value="phone">📱 Téléphone (contrôle de ton Android)</option>
      </select>
    </div>
    <div id="who" data-state="idle">
      <div id="avatarWrap"><span class="glow"></span><canvas id="avatar" width="88" height="88" title="Dis bonjour à Muse"></canvas></div>
      <div id="whoName"><b>Muse</b><small id="status">✨ en ligne</small></div>
    </div>
    <div></div>
  </div>
  <div id="msgs"></div>
  <div id="pending" hidden></div>
  <form id="f">
    <div id="plusWrap">
      <button type="button" class="ghost ico" id="plusBtn" title="Joindre des fichiers, photos ou un dossier">＋</button>
      <div id="plusMenu" hidden>
        <button type="button" id="optFile">📎 Fichiers <small>PDF, Word, Excel, code…</small></button>
        <button type="button" id="optPhoto">🖼️ Photos</button>
        <button type="button" id="optCam">📷 Appareil photo</button>
        <button type="button" id="optDir">📁 Dossier <small>envoyé en .zip</small></button>
        <p>Sur téléphone : compresse ton dossier en .zip puis choisis « Fichiers ».</p>
      </div>
    </div>
    <textarea id="in" rows="1" placeholder="Écris à Muse…"></textarea>
    <button class="btn" id="send"><span class="lbl">Envoyer </span>🚀</button>
    <input type="file" id="fileIn" multiple hidden>
    <input type="file" id="photoIn" multiple hidden accept="image/*">
    <input type="file" id="dirIn" hidden webkitdirectory multiple>
    <input type="file" id="camIn" hidden accept="image/*" capture="environment">
  </form>
</main>

<dialog id="cfg">
  <h3>⚙️ Connexion au cerveau de Muse</h3>
  <p class="hint">Ces infos restent dans ce navigateur uniquement.</p>
  <label>Dépôt privé (propriétaire/nom)</label>
  <input id="cfgRepo" placeholder="ainacedric/muse-brain" autocapitalize="off" autocomplete="off">
  <label>Token GitHub (fine-grained : Issues + Contents en lecture/écriture sur ce dépôt)</label>
  <input id="cfgTok" type="password" placeholder="github_pat_…" autocomplete="off">
  <div id="cfgMsg" class="hint"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="ghost" id="cfgCancel" type="button">Fermer</button><button class="btn" id="cfgSave" type="button">Tester et enregistrer</button>
  </div>
</dialog>

<dialog id="dlg">
  <h3>🧠 Ce que Muse sait de toi</h3>
  <p class="hint">Un fait par ligne. Modifie ou supprime librement.</p>
  <textarea id="memTxt"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
    <button class="ghost" id="memCancel" type="button">Fermer</button><button class="btn" id="memSave" type="button">Enregistrer</button>
  </div>
</dialog>
<script src="./vendor/jszip.min.js"></script>
<script src="./vendor/three.min.js"></script>
<script src="./avatar.js"></script>
<script src="./app.js"></script>
</body>
</html>
