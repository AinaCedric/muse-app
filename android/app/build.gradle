plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ainacedric.muse'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ainacedric.muse'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    // Clé de signature "sideload" : sert uniquement à ce que les mises à jour de l'appli s'installent par-dessus l'ancienne.
    signingConfigs {
        release {
            storeFile file('muse-sideload.jks')
            storePassword 'musephone'
            keyAlias 'muse'
            keyPassword 'musephone'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
